<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTC Coaching - Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection" class="login-container">
        <form id="loginForm" class="login-form">
            <h2>Student Portal Login</h2>
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" placeholder="e.g. 01" required>
            </div>
            <div class="form-group">
                <label for="studentPassword">Password</label>
                <input type="password" id="studentPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
            <p id="loginMessage"></p>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="dashboard-container" style="display: none;">
        <header class="dashboard-header">
            <h1>Student Dashboard</h1>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </header>

        <main class="dashboard-grid">
            <div class="card">
                <h2>Student Profile</h2>
                <p><strong>Name:</strong> <span id="displayName">-</span></p>
                <p><strong>Student ID:</strong> <span id="displayId">-</span></p>
                <p><strong>Class:</strong> <span id="displayClass">-</span></p>
            </div>

            <div class="card">
                <h3>Fee Details</h3>
                <p>Total Fees: ₹<span id="displayFees">0</span></p>
                <p>Pending Fees: ₹<span id="displayPending">0</span></p>
            </div>

            <div class="card">
                <h3>Academic Performance</h3>
                <p>Overall Percentage: <span id="displayPercentage">0%</span></p>
            </div>

            <div class="card">
                <h3>Attendance Record</h3>
                <p>Attendance Rate: <span id="displayAttendance">0%</span></p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
